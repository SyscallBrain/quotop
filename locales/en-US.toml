# quotop — English (US). This is the reference language: every other locale
# must have exactly these keys and the same {placeholders}.
# See CONTRIBUTING.md ("Adding a language").

[meta]
decimal_separator = "."

[i18n]
unknown_language = "config.toml: unknown language `{code}` (languages: {languages})"

# Command line: usage, help and the messages printed to stderr.
[cli]
usage = "usage: quotop [--json] [--include-paid] [-h | --help] [-V | --version]   (without `--json`, opens the TUI)"
unknown_argument = "unknown argument `{arg}`"
warning = "warning: {message}"
stdout_failed = "could not write to stdout ({error})"
nothing_written = "{error}; nothing was written"
help = """
quotop {version} — remaining balance, credits and quotas of your API services

Usage: quotop [OPTIONS]

Without options, quotop opens the interactive terminal UI.

Options:
      --json           Refresh once, print the readings as JSON and exit
      --include-paid   Also read the services whose balance check spends quota
                       (Brave, Context7)
  -h, --help           Print this help and exit
  -V, --version        Print the version and exit

Files:
  ~/.config/quotop/config.toml   configuration (optional)
  ~/.config/quotop/keys.env      API keys (must have mode 600)
  ~/.cache/quotop/last.json      last readings

Exit codes: 0 success, 1 the output could not be written, 2 usage or configuration error"""

[cli.filtered_out]
one = "{n} per-request provider was left out (`--include-paid` reads it): {ids}"
other = "{n} per-request providers were left out (`--include-paid` reads them): {ids}"

[cli.within_interval]
one = "{n} provider read less than {seconds} s ago kept its previous reading: {ids}"
other = "{n} providers read less than {seconds} s ago kept their previous reading: {ids}"

[cli.unread]
one = "{n} provider has no reading at all (neither now nor in the cache): {ids}"
other = "{n} providers have no reading at all (neither now nor in the cache): {ids}"

# config.toml warnings and errors.
[config]
unknown_key = "{file}: unknown key `{key}` (ignored)"
unknown_threshold_key = "{file}: unknown key `thresholds.{provider}.{key}` (ignored)"
threshold_not_table = "{file}: `thresholds.{provider}` should be a table (ignored)"
read_failed = "could not read {path}: {message}"
invalid = "{path} is invalid: {message}"
invalid_at_line = "{path} is invalid (line {line}): {message}"

# Warnings while loading API keys and subscription credentials.
[credentials]
read_failed = "{path}: could not read ({error})"
open_permissions = "{path}: permissions {mode} give access to group/others, so the file is not read. Run `chmod 600 {path}`"
claude_unusable = "{path}: no usable `claudeAiOauth.accessToken`/`expiresAt`; Claude has no credential"
invalid_json = "{path}: invalid JSON ({error})"

# The readings cache.
[cache]
read_failed = "{path}: could not read the cache ({error}); ignored, not deleted"
unreadable = "{path}: unreadable cache ({error}); ignored, not deleted"
other_version = "{path}: cache version {found} (this version writes {expected}); ignored, not deleted"
serialization_failed = "could not serialize the cache: {message}"
leak_in = "leak prevented: {provider}"
leak = "leak prevented: the cache text contains a secret"

# Saving a key from the services menu.
[keyfile]
rejected = "value rejected: {reason}"
empty = "it is empty"
has_spaces = "it contains spaces"
has_control = "it contains control characters"

# Meter labels, keyed by the English label providers emit. English needs no
# translations, so this table is empty here; other languages translate the
# labels (quoted keys, e.g. "monthly plan" = "…").
[labels]

