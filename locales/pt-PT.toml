# quotop — Português (Portugal).

[meta]
decimal_separator = ","

[i18n]
unknown_language = "config.toml: idioma desconhecido `{code}` (idiomas: {languages})"

# Linha de comandos: uso, ajuda e as mensagens escritas no stderr.
[cli]
usage = "uso: quotop [--json] [--include-paid] [-h | --help] [-V | --version]   (sem `--json` abre a TUI)"
unknown_argument = "argumento desconhecido `{arg}`"
warning = "aviso: {message}"
stdout_failed = "não consegui escrever no stdout ({error})"
nothing_written = "{error}; não escrevi nada"
help = """
quotop {version} — saldo, créditos e quotas dos seus serviços de API

Uso: quotop [OPÇÕES]

Sem opções, o quotop abre a interface interactiva no terminal.

Opções:
      --json           Faz um refresh, escreve as leituras em JSON e sai
      --include-paid   Lê também os serviços cuja consulta do saldo gasta quota
                       (Brave, Context7)
  -h, --help           Mostra esta ajuda e sai
  -V, --version        Mostra a versão e sai

Ficheiros:
  ~/.config/quotop/config.toml   configuração (opcional)
  ~/.config/quotop/keys.env      chaves de API (têm de ter modo 600)
  ~/.cache/quotop/last.json      últimas leituras

Códigos de saída: 0 sucesso, 1 não foi possível escrever o resultado, 2 erro de uso ou de configuração"""

[cli.filtered_out]
one = "{n} provider de custo por pedido ficou de fora (`--include-paid` lê-o): {ids}"
other = "{n} providers de custo por pedido ficaram de fora (`--include-paid` lê-os): {ids}"

[cli.within_interval]
one = "{n} provider lido há menos de {seconds} s ficou com a leitura anterior: {ids}"
other = "{n} providers lidos há menos de {seconds} s ficaram com a leitura anterior: {ids}"

[cli.unread]
one = "{n} provider sem leitura nenhuma (nem agora nem na cache): {ids}"
other = "{n} providers sem leitura nenhuma (nem agora nem na cache): {ids}"

# Avisos e erros do config.toml.
[config]
unknown_key = "{file}: chave desconhecida `{key}` (ignorada)"
unknown_threshold_key = "{file}: chave desconhecida `thresholds.{provider}.{key}` (ignorada)"
threshold_not_table = "{file}: `thresholds.{provider}` devia ser uma tabela (ignorada)"
read_failed = "não consegui ler {path}: {message}"
invalid = "{path} inválido: {message}"
invalid_at_line = "{path} inválido (linha {line}): {message}"

# Avisos ao carregar as chaves de API e as credenciais das subscrições.
[credentials]
read_failed = "{path}: não consegui ler ({error})"
open_permissions = "{path}: permissões {mode} dão acesso a grupo/outros; o ficheiro não é lido. Faça `chmod 600 {path}`"
claude_unusable = "{path}: sem `claudeAiOauth.accessToken`/`expiresAt` utilizáveis; o Claude fica sem credencial"
invalid_json = "{path}: JSON inválido ({error})"

# O cache das leituras.
[cache]
read_failed = "{path}: não consegui ler o cache ({error}); ignorado e não apagado"
unreadable = "{path}: cache ilegível ({error}); ignorado e não apagado"
other_version = "{path}: cache da versão {found} (esta versão escreve {expected}); ignorado e não apagado"
serialization_failed = "não consegui serializar o cache: {message}"
leak_in = "fuga evitada: {provider}"
leak = "fuga evitada: o texto do cache traz um segredo"

# Gravar uma chave a partir do menu de serviços.
[keyfile]
rejected = "valor recusado: {reason}"
empty = "está vazio"
has_spaces = "tem espaços"
has_control = "tem caracteres de controlo"

