name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Never paste real API keys** here — replace them with fake values.
        Security problems (for example, a key showing up somewhere) should be reported privately: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Service(s) involved
      placeholder: e.g. OpenRouter, Claude
  - type: textarea
    id: output
    attributes:
      label: Screen or output
      description: The row as shown in quotop, the detail panel (Enter), or the relevant part of `quotop --json`. Remove anything personal.
      render: text
  - type: input
    id: version
    attributes:
      label: quotop version
      placeholder: output of `quotop --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: e.g. Ubuntu 24.04, kitty
